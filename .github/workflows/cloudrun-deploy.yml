# GitHub Actions workflow for Cloud Run deployment
# Triggers on push to main, manual dispatch, or PR

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_migrations:
        description: 'Skip database migrations'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # For OIDC auth to GCP

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE_NAME: sampada
  SIDEKIQ_SERVICE_NAME: sampada-sidekiq
  REPO_NAME: sampada-docker
  ARTIFACT_REGISTRY: asia-south1-docker.pkg.dev

jobs:
  # Build and test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.13'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sampada_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: test-secret-key-base-for-ci

      - name: Run linter
        run: bundle exec rubocop

  # Build Docker image
  build-image:
    name: Build Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-tag: ${{ steps.set-output.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 480.0.0'
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE_TAG="${ARTIFACT_REGISTRY}/${PROJECT_ID}/${REPO_NAME}/${SERVICE_NAME}:${GITHUB_SHA}"
          docker build -f Dockerfile.cloudrun -t "$IMAGE_TAG" .
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Push image
        run: docker push ${{ steps.build-image.outputs.image-tag }}

  # Run migrations
  run-migrations:
    name: Run Migrations
    needs: build-image
    if: github.event.inputs.skip_migrations != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Run migrations via Cloud Run Job
        run: |
          gcloud run jobs execute sampada-migrate \
            --image=${{ needs.build-image.outputs.image-tag }} \
            --region=${REGION} \
            --project=${PROJECT_ID} \
            --wait \
            --args="bundle,exec,rails,db:migrate"

  # Deploy to Cloud Run
  deploy:
    name: Deploy to Cloud Run
    needs: [build-image, run-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE_NAME} \
            --image=${{ needs.build-image.outputs.image-tag }} \
            --region=${REGION} \
            --project=${PROJECT_ID} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=80 \
            --timeout=300 \
            --service-account=sampada-cloudrun@${PROJECT_ID}.iam.gserviceaccount.com \
            --set-env-vars=RAILS_ENV=production,RAILS_LOG_TO_STDOUT=true,RAILS_SERVE_STATIC_FILES=true,RAILS_MAX_THREADS=80,WEB_CONCURRENCY=1 \
            --set-secrets=DATABASE_URL=sampada-secrets:database-url,REDIS_URL=sampada-secrets:redis-url,SECRET_KEY_BASE=sampada-secrets:secret-key-base,ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=sampada-secrets:encryption-primary-key,ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=sampada-secrets:encryption-deterministic-key,ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=sampada-secrets:encryption-key-derivation-salt,GOOGLE_CLIENT_ID=sampada-secrets:google-client-id,GOOGLE_CLIENT_SECRET=sampada-secrets:google-client-secret,APP_DOMAIN=sampada-secrets:app-domain,CORS_ORIGINS=sampada-secrets:cors-origins,SMTP_ADDRESS=sampada-secrets:smtp-address,SMTP_PORT=sampada-secrets:smtp-port,SMTP_USERNAME=sampada-secrets:smtp-username,SMTP_PASSWORD=sampada-secrets:smtp-password,SMTP_TLS_ENABLED=sampada-secrets:smtp-tls-enabled,BETTER_AUTH_VERIFY_URL=sampada-secrets:better-auth-verify-url,BETTER_AUTH_APP_ID=sampada-secrets:better-auth-app-id,BETTER_AUTH_CACHE_TTL=sampada-secrets:better-auth-cache-ttl \
            --vpc-connector=projects/${PROJECT_ID}/locations/${REGION}/connectors/sampada-vpc \
            --vpc-egress=private-ranges-only

      - name: Deploy Sidekiq
        run: |
          gcloud run deploy ${SIDEKIQ_SERVICE_NAME} \
            --image=${{ needs.build-image.outputs.image-tag }} \
            --region=${REGION} \
            --project=${PROJECT_ID} \
            --platform=managed \
            --no-allow-unauthenticated \
            --command=bundle,exec,sidekiq \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5 \
            --service-account=sampada-cloudrun@${PROJECT_ID}.iam.gserviceaccount.com \
            --set-env-vars=RAILS_ENV=production,RAILS_LOG_TO_STDOUT=true,RAILS_MAX_THREADS=10,WEB_CONCURRENCY=1 \
            --set-secrets=DATABASE_URL=sampada-secrets:database-url,REDIS_URL=sampada-secrets:redis-url,SECRET_KEY_BASE=sampada-secrets:secret-key-base,ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=sampada-secrets:encryption-primary-key,ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=sampada-secrets:encryption-deterministic-key,ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=sampada-secrets:encryption-key-derivation-salt \
            --vpc-connector=projects/${PROJECT_ID}/locations/${REGION}/connectors/sampada-vpc \
            --vpc-egress=private-ranges-only

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe ${SERVICE_NAME} --region=${REGION} --project=${PROJECT_ID} --format='value(status.url)')
          echo "Deployed to: $URL"
          echo "SERVICE_URL=$URL" >> $GITHUB_OUTPUT

      - name: Notify (optional)
        if: always()
        run: |
          echo "Deployment completed. Service URL: ${{ steps.get-url.outputs.SERVICE_URL }}"