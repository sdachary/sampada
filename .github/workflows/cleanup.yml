name: Cleanup (GitHub Actions)

# Retains the newest 5 GitHub Actions runs per workflow and purges older runs
# plus stale artifacts, keeping each repo's Actions history light. Runs daily +
# on-demand. Use dry_run=true on manual dispatch to preview before real cleanup.

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 1 AM
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview what would be deleted, change nothing'
        type: boolean
        default: false

concurrency:
  group: cleanup
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # required to delete runs + artifacts

env:
  KEEP_RUNS: '5'          # retain the newest N runs per workflow
  MIN_AGE_HOURS: '24'     # never delete a run newer than this (protects fresh CI)
  ARTIFACT_AGE_DAYS: '90' # purge artifacts older than this (GitHub default retention)

jobs:
  github-runs:
    name: GitHub Actions runs (keep top 5)
    runs-on: ubuntu-latest
    steps:
      - name: Prune stale runs and artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          node <<'EOF'
          const api = process.env.GITHUB_API_URL || 'https://api.github.com';
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const token = process.env.GH_TOKEN;
          const dryRun = process.env.DRY_RUN === 'true';
          const KEEP = parseInt(process.env.KEEP_RUNS, 10);
          const MIN_AGE_MS = parseInt(process.env.MIN_AGE_HOURS, 10) * 3600e3;
          const ART_AGE_MS = parseInt(process.env.ARTIFACT_AGE_DAYS, 10) * 864e5;
          const now = Date.now();

          async function gh(path, method = 'GET') {
            const res = await fetch(api + path, {
              method,
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
            });
            if (!res.ok && res.status !== 204) {
              throw new Error(`${method} ${path} -> ${res.status} ${await res.text()}`);
            }
            return res.status === 204 ? null : res.json();
          }

          async function listCollection(basePath) {
            const all = [];
            let page = 1;
            for (;;) {
              const d = await gh(`${basePath}?per_page=100&page=${page}`);
              const arr = d.workflow_runs || d.workflows || d.artifacts || [];
              if (arr.length === 0) break;
              all.push(...arr);
              if (arr.length < 100) break;
              page++;
            }
            return all;
          }

          // 1) Stale runs: keep newest KEEP per workflow.
          const workflows = await listCollection(`/repos/${owner}/${repo}/actions/workflows`);
          let runsDeleted = 0;
          for (const wf of workflows) {
            if (wf.state !== 'active') continue;
            const runs = await listCollection(`/repos/${owner}/${repo}/actions/workflows/${wf.id}/runs`);
            runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (let i = 0; i < runs.length; i++) {
              if (i < KEEP) continue;
              const age = now - new Date(runs[i].created_at).getTime();
              if (age < MIN_AGE_MS) continue; // too fresh to purge
              if (dryRun) { console.log(`[dry] would delete run ${runs[i].id} (${wf.name}, ${runs[i].created_at})`); continue; }
              await gh(`/repos/${owner}/${repo}/actions/runs/${runs[i].id}`, 'DELETE');
              console.log(`deleted run ${runs[i].id} (${wf.name}, ${runs[i].created_at})`);
              runsDeleted++;
            }
          }
          console.log(`Runs deleted: ${runsDeleted}`);

          // 2) Old + expired artifacts.
          const artifacts = await listCollection(`/repos/${owner}/${repo}/actions/artifacts`);
          let artsDeleted = 0;
          for (const a of artifacts) {
            const age = now - new Date(a.created_at).getTime();
            if (!a.expired && age < ART_AGE_MS) continue;
            if (dryRun) { console.log(`[dry] would delete artifact ${a.name} (${a.created_at})`); continue; }
            await gh(`/repos/${owner}/${repo}/actions/artifacts/${a.id}`, 'DELETE');
            console.log(`deleted artifact ${a.name} (${a.created_at})`);
            artsDeleted++;
          }
          console.log(`Artifacts deleted: ${artsDeleted}`);
          if (dryRun) console.log('DRY RUN — nothing changed');
          EOF
