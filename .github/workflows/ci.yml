name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks
        run: docker run -v ${{ github.workspace }}:/repo ghcr.io/gitleaks/gitleaks:latest detect -c /repo/.gitleaks.toml -s /repo

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: worker
      - name: Type check
        run: npm run tsc
        working-directory: worker
      - name: Test
        run: npm test
        working-directory: worker
      - name: Deploy dry-run
        run: npx wrangler deploy --dry-run
        working-directory: worker

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run linter
        run: npm run lint
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend
      - name: Run npm audit (dev deps only, warn only)
        run: npm audit --audit-level=high --omit=dev || true
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Check bundle size
        run: npm run size
        working-directory: frontend
      - name: Start preview server
        run: npm run preview -- --port 4173 &
        working-directory: frontend
      - name: Wait for preview
        run: sleep 5 && curl -f http://localhost:4173/
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: frontend
      - name: Mount smoke test (hard gate)
        run: npx playwright test test/mount.test.js
        working-directory: frontend
      - name: Lighthouse CI
        run: npx lhci autorun
        working-directory: frontend
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Accessibility tests (axe) (warn only)
        run: npx playwright test test/accessibility.test.js || true
        working-directory: frontend
      - name: Visual smoke tests (warn only)
        run: npx playwright test test/visual-smoke.test.js || true
        working-directory: frontend
