name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/**'
  # Without this, PR checks were only the Cloudflare Pages preview: rubocop,
  # brakeman, bundler-audit, rspec and the frontend build all ran after the
  # merge, never before it. Same blind spot bepara and sadhan had.
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: gitleaks
        run: docker run -v ${{ github.workspace }}:/repo ghcr.io/gitleaks/gitleaks:latest detect -c /repo/.gitleaks.toml -s /repo
      - name: Run RuboCop
        run: bundle exec rubocop --parallel
      - name: Run Brakeman
        run: bundle exec brakeman -A --no-pager --exit-on-warn
      - name: Run Bundler Audit
        run: bundle exec bundle-audit check --update

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run linter
        run: npm run lint
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend
      - name: Run npm audit (dev deps only, warn only)
        run: npm audit --audit-level=high --omit=dev || true
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Check bundle size
        run: npm run size
        working-directory: frontend
      - name: Start preview server
        run: npm run preview -- --port 4173 &
        working-directory: frontend
      - name: Wait for preview
        run: sleep 5 && curl -f http://localhost:4173/
      - name: Lighthouse CI
        run: npx lhci autorun
        working-directory: frontend
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Accessibility tests (axe)
        run: npx playwright test test/accessibility.test.js
        working-directory: frontend
      - name: Visual smoke tests
        run: npx playwright test test/visual-smoke.test.js
        working-directory: frontend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sampada
          POSTGRES_PASSWORD: sampada
          POSTGRES_DB: sampada_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Auto-fix RuboCop offenses
        run: bundle exec rubocop -A
      - name: Setup database
        env:
          DATABASE_URL: postgres://sampada:sampada@localhost:5432/sampada_test
          RAILS_ENV: test
        run: bin/rails db:create db:migrate 2>&1
      - name: Run RSpec
        env:
          DATABASE_URL: postgres://sampada:sampada@localhost:5432/sampada_test
          RAILS_ENV: test
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY_BASE: test_secret_key_base_for_ci
        run: bundle exec rspec
      - name: gitleaks
        run: docker run -v ${{ github.workspace }}:/repo ghcr.io/gitleaks/gitleaks:latest detect -c /repo/.gitleaks.toml -s /repo
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/