name = "sampada-api-production"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
# Legal pages are imported as text modules in src/index.ts.
rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = true }
]
account_id = "58282ee997b7a801c27e7d0276f9ae8e"

[[d1_databases]]
binding = "DB"
database_name = "sampada-db"
database_id = "d37831a5-f712-49d6-861f-83a0bdfa7ac4"

[[r2_buckets]]
binding = "FILES"
bucket_name = "sampada-storage"

[vars]
ENVIRONMENT = "production"
RP_ID = "vayalabs.in"
RP_NAME = "Sampada"
ALLOWED_ORIGINS = "https://sampada.vayalabs.in"

[triggers]
crons = ["*/30 * * * *", "0 2,3,4,9 * * *"]