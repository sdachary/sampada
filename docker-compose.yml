services:
  app:
    build: .
    image: sampada:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      DB_HOST: ${DB_HOST:-10.0.1.46}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: redis://${REDIS_HOST:-10.0.1.46}:6379/0
      BETTER_AUTH_VERIFY_URL: ${BETTER_AUTH_VERIFY_URL:-http://localhost:4000/api/auth/verify}
      BETTER_AUTH_APP_ID: ${BETTER_AUTH_APP_ID:-sampada}
      BETTER_AUTH_CACHE_TTL: ${BETTER_AUTH_CACHE_TTL:-300}
      DATABASE_BACKUP_ENABLED: ${DATABASE_BACKUP_ENABLED:-false}
    volumes:
      - sampada-storage:/rails/storage

  sidekiq:
    image: sampada:latest
    restart: unless-stopped
    depends_on:
      - app
    command: ["bundle", "exec", "sidekiq"]
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      DB_HOST: ${DB_HOST:-10.0.1.46}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: redis://${REDIS_HOST:-10.0.1.46}:6379/0
      BETTER_AUTH_VERIFY_URL: ${BETTER_AUTH_VERIFY_URL:-http://localhost:4000/api/auth/verify}
      BETTER_AUTH_APP_ID: ${BETTER_AUTH_APP_ID:-sampada}
      BETTER_AUTH_CACHE_TTL: ${BETTER_AUTH_CACHE_TTL:-300}
      DATABASE_BACKUP_ENABLED: ${DATABASE_BACKUP_ENABLED:-false}
    volumes:
      - sampada-storage:/rails/storage

volumes:
  sampada-storage:
